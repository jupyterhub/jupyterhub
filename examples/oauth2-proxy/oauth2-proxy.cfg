# oauth2-proxy config file
# ref: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
# most config is in oauth2-proxy.yaml,
# but not everything is configurable via alpha config
cookie_secret = "5som_a_rmy2dS2nEQNRnVIVa1gSipsMp15Jg9TeXs7o="
cookie_secure = false
# skip_provider_button=True does auto-login
# skip_provider_button = true

# Accept JWT Bearer tokens in the Authorization header
skip_jwt_bearer_tokens = true
bearer_token_login_fallback = false
# force_json_errors gives nicer errors for API access,
# but prevents browser login
# force_json_errors = true

# don't validate emails (usernames),
# we will authorize via other means
email_domains = ["*"]
