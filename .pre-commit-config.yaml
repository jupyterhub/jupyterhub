# pre-commit is a tool to perform a predefined set of tasks manually and/or
# automatically before git commits are made.
#
# Config reference: https://pre-commit.com/#pre-commit-configyaml---top-level
#
# Common tasks
#
# - Run on all files:   pre-commit run --all-files
# - Register git hooks: pre-commit install --install-hooks
#

ci:
  # pre-commit.ci will open PRs updating our hooks once a month
  autoupdate_schedule: monthly

repos:
  # Autoformat: Python code, syntax patterns are modernized
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312 # frozen: v3.22.0
    hooks:
      - id: pyupgrade

  # Autoformat: Python lint fixes
  - repo: https://github.com/PyCQA/autoflake
    rev: 6d9dd2716540ab776f29c7b896cd3052ef4619b2 # frozen: v2.4.0
    hooks:
      - id: autoflake
        args:
          - --in-place

  # Autoformat: python imports
  - repo: https://github.com/pycqa/isort
    rev: 5d9c96196def28a1819b6a755a669ec0a3add6aa # frozen: 10.0.0b2
    hooks:
      - id: isort

  # Autoformat: Python code
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88 # frozen: 26.10.1
    hooks:
      - id: black

  # Lint: Python code
  - repo: https://github.com/PyCQA/flake8
    rev: 960c1d286190804104f7255b97da034446fdaac3 # frozen: 7.5.0
    hooks:
      - id: flake8

  # Autoformat: markdown, yaml, javascript (see the file .prettierignore)
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
        exclude: .*/templates/.*|docs/source/_static/rest-api.yml|docs/source/rbac/scope-table.md

  # autoformat HTML templates
  - repo: https://github.com/djlint/djLint
    rev: fe43565b6701521953d39388ff834e33ea5fce6d # frozen: v1.49.3
    hooks:
      - id: djlint-reformat-jinja
        files: ".*templates/.*.html"
        types_or: ["html"]
        exclude: redoc.html
      - id: djlint-jinja
        files: ".*templates/.*.html"
        types_or: ["html"]

  # github actions security checks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        args:
          - --fix

  # Autoformat and linting, misc. details
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: share/jupyterhub/static/js/admin-react.js
      - id: requirements-txt-fixer
      - id: check-case-conflict
      - id: check-executables-have-shebangs

  # source docs: rest-api.yml and scope-table.md are autogenerated
  - repo: local
    hooks:
      - id: update-api-and-scope-docs
        name: Update rest-api.yml and scope-table.md based on scopes.py
        language: python
        additional_dependencies: ["pytablewriter", "ruamel.yaml"]
        entry: python docs/source/rbac/generate-scope-table.py
        args:
          - --update
        files: jupyterhub/scopes.py
        pass_filenames: false
